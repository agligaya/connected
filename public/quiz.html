<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      function syncLayoutMode() {
        var mobile = window.matchMedia('(max-width: 900px)').matches;
        document.documentElement.classList.toggle('layout-mobile', mobile);
        document.documentElement.classList.toggle('layout-desktop', !mobile);
      }
      syncLayoutMode();
      window.matchMedia('(max-width: 900px)').addEventListener('change', syncLayoutMode);
    })();
  </script>
  <title>ConnectED Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=20260913q2" />
  <style>
    body { margin: 0; background: #f4ebe4; }
    .quiz-page { max-width: 720px; margin: 0 auto; padding: 16px 12px 40px; box-sizing: border-box; }
    .quiz-card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); margin-bottom: 14px; }
    .quiz-q { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #eee; }
    .quiz-q:last-child { border-bottom: none; }
    .quiz-choices label {
      display: block;
      margin: 8px 0;
      padding: 12px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      line-height: 1.35;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-choices label:hover,
    .quiz-choices label:has(input:checked) { border-color: #b71c1c; background: rgba(183,28,28,.04); }
    .quiz-choices input { margin-right: 8px; transform: scale(1.15); }
    .quiz-error { color: #b71c1c; margin-top: 8px; }
    .quiz-success { color: #1b5e20; }
    .quiz-meta { color: #666; margin: 4px 0 16px; font-size: 0.9rem; word-break: break-word; }
    textarea.quiz-sa { width: 100%; min-height: 88px; border-radius: 10px; border: 1px solid #ccc; padding: 12px; font: inherit; font-size: 16px; box-sizing: border-box; }
    #quiz-lrn, #quiz-identify, #quiz-submit, #quiz-change-lrn { width: 100%; box-sizing: border-box; min-height: 46px; font-size: 16px; }
    #quiz-identify, #quiz-submit { margin-top: 8px; }
    #quiz-title { font-size: 1.25rem; line-height: 1.3; word-break: break-word; }
    .quiz-identity-box {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8f1ec;
      border: 1px solid rgba(128, 0, 32, 0.12);
    }
    .quiz-identity-name { font-size: 1.05rem; font-weight: 700; color: #5c1010; margin: 0 0 4px; }
    .quiz-identity-status { margin: 0; font-size: 0.88rem; color: #555; }
    @media (max-width: 480px) {
      .quiz-page { padding: 12px 10px 32px; }
      .quiz-card { padding: 14px 12px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="quiz-page">
    <div class="quiz-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <img src="/assets/connectED.png" alt="ConnectED" width="40" height="40" />
        <strong class="font-heading">ConnectED Quiz</strong>
      </div>
      <div id="quiz-status">Loading…</div>
    </div>

    <div id="quiz-form-wrap" class="quiz-card" hidden>
      <h1 class="page-heading font-heading" id="quiz-title" style="font-size:1.35rem;"></h1>
      <p class="quiz-meta" id="quiz-meta"></p>

      <div id="quiz-lrn-step">
        <div class="field-small" style="margin-bottom:12px;">
          <label for="quiz-lrn"><strong>Enter your LRN</strong></label>
          <input type="text" id="quiz-lrn" inputmode="numeric" autocomplete="off"
                 maxlength="12" placeholder="12-digit LRN" aria-describedby="quiz-lrn-hint" />
          <p id="quiz-lrn-hint" class="quiz-meta" style="margin:6px 0 0;">
            After you confirm, your name will appear. Present or Late students can take the quiz.
            Absent or Excused need a teacher make-up allowance.
          </p>
        </div>
        <p id="quiz-identify-error" class="quiz-error" hidden></p>
        <button type="button" class="btn-solid" id="quiz-identify">Confirm LRN</button>
      </div>

      <div id="quiz-identity" hidden>
        <div class="quiz-identity-box">
          <p class="quiz-identity-name" id="quiz-student-name"></p>
          <p class="quiz-identity-status" id="quiz-student-status"></p>
        </div>
        <button type="button" class="chip-ghost" id="quiz-change-lrn" style="margin-bottom:14px;">← Use a different LRN</button>
      </div>

      <div id="quiz-questions-wrap" hidden>
        <div id="quiz-questions"></div>
        <p id="quiz-form-error" class="quiz-error" hidden></p>
        <button type="button" class="btn-solid" id="quiz-submit">Submit answers</button>
      </div>

      <p id="quiz-block-msg" class="quiz-error" hidden></p>
    </div>

    <div id="quiz-done" class="quiz-card" hidden>
      <h2 class="font-heading quiz-success">Submitted</h2>
      <p id="quiz-done-msg"></p>
    </div>
  </main>

  <script>
    (function () {
      const token = (location.pathname.split('/').filter(Boolean).pop() || '').trim();
      const statusEl = document.getElementById('quiz-status');
      const formWrap = document.getElementById('quiz-form-wrap');
      const doneWrap = document.getElementById('quiz-done');
      const qBox = document.getElementById('quiz-questions');
      const questionsWrap = document.getElementById('quiz-questions-wrap');
      const lrnStep = document.getElementById('quiz-lrn-step');
      const identityBox = document.getElementById('quiz-identity');
      const lrnInput = document.getElementById('quiz-lrn');
      const identifyErr = document.getElementById('quiz-identify-error');
      const blockMsg = document.getElementById('quiz-block-msg');
      const errEl = document.getElementById('quiz-form-error');
      let quizData = null;
      let identified = null;
      let confirmedLrn = '';

      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function normalizeLrn(value) {
        return String(value || '').replace(/\D/g, '').slice(0, 12);
      }

      function renderQuestions() {
        qBox.innerHTML = (quizData.questions || []).map(function (q, i) {
          const isMcq = q.item_type === 'mcq' || (q.choices && q.choices.length);
          let body = '';
          if (isMcq) {
            body = '<div class="quiz-choices">' + (q.choices || []).map(function (c, j) {
              const id = 'q' + q.id + '_' + j;
              return '<label for="' + id + '"><input type="radio" name="q_' + q.id + '" id="' + id + '" value="' + esc(c) + '" /> ' + esc(c) + '</label>';
            }).join('') + '</div>';
          } else {
            body = '<textarea class="quiz-sa" data-qid="' + q.id + '" placeholder="Your answer"></textarea>';
          }
          return '<div class="quiz-q" data-qid="' + q.id + '" data-mcq="' + (isMcq ? '1' : '0') + '">' +
            '<p><strong>' + (i + 1) + '.</strong> ' + esc(q.question) +
            ' <span class="page-subheading">(' + (q.points || 1) + ' pts)</span></p>' + body + '</div>';
        }).join('');
      }

      function resetIdentity() {
        identified = null;
        confirmedLrn = '';
        identityBox.hidden = true;
        questionsWrap.hidden = true;
        blockMsg.hidden = true;
        blockMsg.textContent = '';
        lrnStep.hidden = false;
        if (lrnInput) {
          lrnInput.disabled = false;
          lrnInput.focus();
        }
      }

      async function load() {
        if (!token) {
          statusEl.textContent = 'Invalid quiz link.';
          return;
        }
        try {
          const res = await fetch('/api/quiz/' + encodeURIComponent(token));
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not load quiz');
          quizData = data;
          statusEl.hidden = true;
          formWrap.hidden = false;
          document.getElementById('quiz-title').textContent = data.title || 'Quiz';
          document.getElementById('quiz-meta').textContent =
            'Grade ' + data.grade_level + '-' + data.section +
            (data.subject_name ? ' · ' + data.subject_name : '') +
            ' · Max ' + data.max_score;
          if (lrnInput) lrnInput.value = '';
          resetIdentity();
        } catch (e) {
          statusEl.textContent = e.message || 'Failed to load quiz.';
        }
      }

      if (lrnInput) {
        lrnInput.addEventListener('input', function () {
          lrnInput.value = normalizeLrn(lrnInput.value);
        });
        lrnInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('quiz-identify').click();
          }
        });
      }

      async function identifyWithLrn(lrn, opts) {
        const silent = !!(opts && opts.silent);
        if (!silent) {
          identifyErr.hidden = true;
          blockMsg.hidden = true;
        }
        const res = await fetch('/api/quiz/' + encodeURIComponent(token) + '/identify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lrn: lrn })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not verify LRN');

        identified = data;
        confirmedLrn = lrn;
        lrnStep.hidden = true;
        identityBox.hidden = false;
        document.getElementById('quiz-student-name').textContent = data.student_name || 'Student';
        const statusLabel = data.attendance_status
          ? ('Attendance: ' + data.attendance_status + (data.makeup ? ' · Make-up allowed' : ''))
          : 'Attendance: not recorded';
        document.getElementById('quiz-student-status').textContent = statusLabel;

        if (!data.eligible) {
          questionsWrap.hidden = true;
          blockMsg.textContent = data.block_reason || 'You cannot take this quiz right now.';
          blockMsg.hidden = false;
          return data;
        }

        blockMsg.hidden = true;
        // Keep existing answers if still eligible; only build the form when empty.
        if (!qBox.querySelector('.quiz-q')) renderQuestions();
        questionsWrap.hidden = false;
        return data;
      }

      document.getElementById('quiz-identify').addEventListener('click', async function () {
        const lrn = normalizeLrn(lrnInput ? lrnInput.value : '');
        if (lrn.length !== 12) {
          identifyErr.textContent = 'Enter your 12-digit LRN.';
          identifyErr.hidden = false;
          if (lrnInput) lrnInput.focus();
          return;
        }

        try {
          await identifyWithLrn(lrn, { silent: false });
        } catch (e) {
          identifyErr.textContent = e.message || 'Could not verify LRN.';
          identifyErr.hidden = false;
        }
      });

      document.getElementById('quiz-change-lrn').addEventListener('click', function () {
        resetIdentity();
      });

      // Re-check attendance when tab is focused so Present→Absent corrections apply without full reload.
      let recheckBusy = false;
      async function recheckEligibility() {
        if (recheckBusy || !confirmedLrn || confirmedLrn.length !== 12) return;
        if (doneWrap && !doneWrap.hidden) return;
        recheckBusy = true;
        try {
          const prevEligible = identified && identified.eligible;
          const data = await identifyWithLrn(confirmedLrn, { silent: true });
          if (prevEligible && data && !data.eligible) {
            qBox.innerHTML = '';
          }
        } catch (_) {
          /* keep current UI if transient error */
        } finally {
          recheckBusy = false;
        }
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') recheckEligibility();
      });
      window.addEventListener('focus', recheckEligibility);

      document.getElementById('quiz-submit').addEventListener('click', async function () {
        errEl.hidden = true;
        if (!identified || !identified.eligible || !identified.student_id) {
          errEl.textContent = 'Confirm your LRN before submitting.';
          errEl.hidden = false;
          return;
        }
        if (confirmedLrn.length !== 12) {
          errEl.textContent = 'Confirm your 12-digit LRN again.';
          errEl.hidden = false;
          return;
        }

        const answers = [];
        qBox.querySelectorAll('.quiz-q').forEach(function (block) {
          const qid = block.getAttribute('data-qid');
          const isMcq = block.getAttribute('data-mcq') === '1';
          let answer = '';
          if (isMcq) {
            const checked = block.querySelector('input[type="radio"]:checked');
            answer = checked ? checked.value : '';
          } else {
            const ta = block.querySelector('textarea');
            answer = ta ? ta.value.trim() : '';
          }
          answers.push({ question_id: Number(qid), answer: answer });
        });

        try {
          const res = await fetch('/api/quiz/' + encodeURIComponent(token) + '/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              student_id: Number(identified.student_id),
              lrn: confirmedLrn,
              answers: answers
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Submit failed');
          formWrap.hidden = true;
          doneWrap.hidden = false;
          document.getElementById('quiz-done-msg').textContent =
            (data.student_name || 'Student') + ' — score ' + data.score + ' / ' + data.max_score +
            '. ' + (data.message || '');
        } catch (e) {
          errEl.textContent = e.message || 'Submit failed.';
          errEl.hidden = false;
        }
      });

      load();
    })();
  </script>
</body>
</html>
